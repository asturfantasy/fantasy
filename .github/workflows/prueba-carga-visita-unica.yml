# ============================================================
# .github/workflows/prueba-carga-visita-unica.yml
# Lanza la prueba de carga con patrón "una visita, no un bucle"
# desde los servidores de GitHub, no desde tu ordenador.
#
# Se ejecuta SOLO manualmente, desde la pestaña "Actions" de tu
# repo → "Prueba de carga (visita única)" → botón "Run workflow".
# No corre solo, ni con cron, ni con push.
# ============================================================

name: Prueba de carga (visita única)

on:
  workflow_dispatch:
    inputs:
      tasa_pico:
        description: 'Usuarios nuevos por segundo en el pico'
        required: false
        default: '5'
      duracion_subida:
        description: 'Tiempo para llegar al pico (ej: 300s)'
        required: false
        default: '300s'

jobs:
  prueba-carga-visita-unica:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Ejecutar prueba de carga (visita única)
        env:
          K6_TASA_PICO: ${{ github.event.inputs.tasa_pico }}
          K6_DURACION_SUBIDA: ${{ github.event.inputs.duracion_subida }}
        run: |
          k6 run scripts/prueba_carga_visita_unica.js

      - name: Subir el resumen como resultado descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-prueba-carga-visita-unica
          path: summary.json
          if-no-files-found: ignore